:root{--bg:#eadcb8;--fg:#2a1a0a;--btn:#2f7d33;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b120a;--fg:#f0d9a0;--btn:#4caf50;--btnfg:#06150a}}
:root[data-theme="dark"]{--bg:#1b120a;--fg:#f0d9a0;--btn:#4caf50;--btnfg:#06150a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:MinecraftFive,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
canvas{display:block;flex:none;touch-action:none;width:min(calc(100% - 14px),calc((100dvh - 110px) * .625));aspect-ratio:400/640;border-radius:6px;outline:4px solid #1a0f08;background:#0b2a14;margin:0 auto}
.pad{display:flex;justify-content:center;gap:10px;width:100%;padding:0 8px;box-sizing:border-box}
button{flex:1;min-height:52px;border:3px solid #1a0f08;border-radius:12px;background:#f0d9a0;color:#1a0f08;box-shadow:0 3px 0 #1a0f08;font:400 17px MinecraftFive,Georgia,serif}
button:active{filter:brightness(.8)}
body.touch .pad{display:none}
body.touch canvas,body.touch .top{width:min(calc(100% - 14px),calc((100dvh - 70px) * .625))}
.pad button{flex:none;width:76px}.pad #f{width:156px}
.top{width:min(calc(100% - 14px),calc((100dvh - 110px) * .625));display:flex;justify-content:flex-end;margin:8px auto 8px;flex:none}
#mb{flex:none;min-height:40px;padding:0 14px;font-size:15px}
#mb i{display:inline-block;width:4px;height:12px;background:#1a0f08;margin-right:3px;vertical-align:-1px}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,5,.82);z-index:10;padding:16px;box-sizing:border-box}
#menu.on{display:flex}
.card{background:#eadcb8;color:#1a0f08;border:4px solid #1a0f08;border-radius:16px;box-shadow:0 5px 0 #1a0f08;padding:18px;width:min(100%,340px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;font-family:MinecraftFive,Georgia,serif}
.card h2{margin:0 0 4px;text-align:center;font:400 26px MinecraftFive,MinecraftFive,Georgia,serif}
.card button{flex:none;width:100%}
#worlds{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:55vh;overflow:auto}#worlds button{min-height:42px;font-size:12px}#worlds button:disabled{opacity:.4}.card section{display:flex;flex-direction:column;gap:10px}.shop-row{border:2px solid #5b4020;border-radius:9px;padding:8px;font:13px system-ui;background:#f7e9c5}.shop-row strong{display:block;font:15px MinecraftFive,Georgia,serif}.shop-row button{margin-top:6px;font:13px MinecraftFive,Georgia,serif;min-height:40px}
.card label{font-size:14px;display:flex;flex-direction:column;gap:6px}
#vol{width:100%;touch-action:pan-x;accent-color:#2f7d33}
.note{font-size:12px;text-align:center;opacity:.8;margin:0}

body.auth-locked .top,body.auth-locked #c,body.auth-locked .pad,body.auth-locked #menu{visibility:hidden}
#auth-screen{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;background:radial-gradient(circle at 50% 20%,#245b35,#081b10 72%);font-family:MinecraftFive,Georgia,serif}
#auth-screen[hidden]{display:none}
.auth-card{width:min(100%,360px);box-sizing:border-box;background:#eadcb8;color:#1a0f08;border:4px solid #1a0f08;border-radius:16px;box-shadow:0 6px 0 #1a0f08;padding:20px;display:flex;flex-direction:column;gap:12px}
.auth-card h1{font-size:22px;text-align:center;margin:0}
.auth-card p{font-size:12px;line-height:1.5;text-align:center;margin:0}
.auth-card label{display:flex;flex-direction:column;gap:6px;font-size:13px}
.auth-card input{width:100%;box-sizing:border-box;min-height:44px;border:2px solid #1a0f08;border-radius:8px;padding:8px;font:16px system-ui;background:#fff9e8;color:#1a0f08}
.auth-card button{flex:none;width:100%;min-height:46px}
.auth-card .auth-help{opacity:.8}
.player-profile{display:flex;align-items:center;gap:7px;position:relative;margin-right:auto;min-width:0;color:#fff;font:13px MinecraftFive,Georgia,serif;text-shadow:1px 2px #1a0f08}
#profile-avatar{flex:none;width:38px;height:38px;min-height:38px;padding:0;border-radius:50%;font-size:18px}
#profile-name{max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-menu{position:absolute;z-index:30;top:44px;left:0;width:150px;padding:8px;background:#eadcb8;border:3px solid #1a0f08;border-radius:10px;box-shadow:0 3px #1a0f08}
.profile-menu button{width:100%;min-height:40px;font-size:12px}

  g.strokeStyle='#1a0f08';g.lineWidth=2.2;eb.forEach(function(b){if(b.hm){g.fillStyle='#1a0f08';g.fillRect(b.x-11,b.y-11,22,22);g.fillStyle='#7c4dff';g.fillRect(b.x-9,b.y-9,18,18);g.fillStyle='#d1c4ff';g.fillRect(b.x-6,b.y-4,5,5);g.fillRect(b.x+1,b.y-4,5,5);g.fillStyle='#1a0f08';g.fillRect(b.x-4,b.y-3,2,3);g.fillRect(b.x+3,b.y-3,2,3);return;}g.fillStyle='#1a0f08';g.fillRect(b.x-7,b.y-7,14,14);g.fillStyle='#ff6fa5';g.fillRect(b.x-5,b.y-5,10,10);g.fillStyle='#ffd6e7';g.fillRect(b.x-3,b.y-3,4,4);});
  coinFly.forEach(function(c){var bob=Math.sin(t*9+(c.phase||0))*2;drawCoin(c.x,c.y+bob,27);});
   pu.forEach(function(p){if(p.k===5&&goldTotem(p.x,p.y+Math.round(Math.sin(t*5)*2)*2,64,t))return;var c=PU[p.k],o=Math.round(Math.sin(t*8+p.x)*2)*2;g.fillStyle='#1a0f08';g.fillRect(p.x-12,p.y-12+o,24,24);g.fillStyle=c[1];g.fillRect(p.x-10,p.y-10+o,20,20);g.fillStyle='rgba(255,255,255,.6)';g.fillRect(p.x-10,p.y-10+o,20,4);g.fillRect(p.x-10,p.y-10+o,4,20);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(p.x-10,p.y+6+o,20,4);g.fillRect(p.x+6,p.y-10+o,4,20);g.fillStyle='#1a0f08';g.font='bold 16px monospace';g.textAlign='center';g.fillText(c[0],p.x,p.y+6+o);});
  if(st!=='inicio'&&!(inv>0&&Math.floor(t*12)%2)){

  drawFx();parts.forEach(function(p){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle=p.c;g.fillRect(p.x-3,p.y-3,6,6);});

  if(st!=='inicio'){

  }
  if(st==='inicio'){
    FF='MinecraftFive';txt('Tucansitos al aire',205,27,'#ffd23f');FF='MinecraftFive';txt('★  ★  ★',236,16,'#f0d9a0');

    if(st==='mundo'){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);txt('MUNDO '+(wi+1),H/2-34,20,'#ffd23f');txt(P.n,H/2+2,16,'#f6e7b4');txt(P.a,H/2+27,11,SH[0].col);}

function mix(a,b,f){var c=[];for(var i=0;i<3;i++){var x=parseInt(a.substr(1+i*2,2),16),y=parseInt(b.substr(1+i*2,2),16);c.push(Math.round(x+(y-x)*f));}return 'rgb('+c+')';}
function bands(P){g.fillStyle=P.bg[0];g.fillRect(0,0,W,H);
  for(var i=1;i<6;i++){g.fillStyle=mix(P.bg[0],P.bg[1],i/5);g.beginPath();g.moveTo(0,H);var y0=H*i/6;g.lineTo(0,y0);
    for(var x=0;x<=W;x+=24){var yy=y0+Math.round(Math.sin(x*.035+i*2.3)*9/8)*8;g.lineTo(x,yy);g.lineTo(x+24,yy);}
    g.lineTo(W,H);g.closePath();g.fill();
    for(var x2=0;x2<W;x2+=24){var y2=y0+Math.round(Math.sin(x2*.035+i*2.3)*9/8)*8;for(var xx=x2;xx<x2+24;xx+=8){g.fillRect(xx,y2-4,4,4);g.fillRect(xx+4,y2,4,4);}}}}
function hearts(){for(var i=0;i<Math.min(Math.max(vidas,0),9);i++){var x=12+i*14,y=30;g.fillStyle='#ff4d5a';g.strokeStyle='#1a0f08';g.lineWidth=1.8;g.beginPath();g.moveTo(x,y+4);g.bezierCurveTo(x-9,y-3,x-4,y-9,x,y-3);g.bezierCurveTo(x+4,y-9,x+9,y-3,x,y+4);g.fill();g.stroke();}
  if(tot>0){var tx=112,ty=9;totem(tx,ty);g.fillStyle='#fff';g.strokeStyle='#1a0f08';g.lineWidth=3;g.font='bold 10px monospace';g.textAlign='left';g.strokeText('x'+tot,tx+17,ty+17);g.fillText('x'+tot,tx+17,ty+17);}}
var bjx=0,bjy=0,bjw=0,bT=0;
function boil(dt){bT-=dt;if(bT<=0){bT=.11;bjx=(Math.random()-.5)*1.6;bjy=(Math.random()-.5)*1.6;bjw=Math.random()*.5;}}
var fx=[];
function spark(x,y,s){if(fx.length<40)fx.push({x:x,y:y,t:0,k:0,s:s||1});}
function puff(x,y,s){fx.push({x:x,y:y,t:0,k:1,s:s||1,o:[0,1,2,3,4].map(function(){return[R(-12,12),R(-10,10),R(7,12)];})});}
function drawFx(){fx.forEach(function(f){var u=f.t/.3;g.save();g.translate(f.x,f.y);g.strokeStyle='#1a0f08';g.lineWidth=f.s<1?1.3:2.2;g.fillStyle='#fff6d8';
  if(f.k===0){var r=(6+16*u)*f.s;g.beginPath();for(var i=0;i<16;i++){var a=i*Math.PI/8,rr=i%2?r*.45:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}g.closePath();g.fill();g.stroke();}
  else{g.globalAlpha=Math.max(0,1-u*u);f.o.forEach(function(c){g.beginPath();g.arc(c[0]*(1+u)*f.s,c[1]*(1+u)*f.s-u*8,c[2]*(.6+.9*u)*f.s,0,6.28);g.fill();g.stroke();});}
  g.restore();});}
var VG=null;
function vintage(){
  g.fillStyle='rgba(255,226,170,.10)';g.fillRect(0,0,W,H);
  if(!VG){VG=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);VG.addColorStop(0,'rgba(0,0,0,0)');VG.addColorStop(1,'rgba(30,15,5,.38)');}
  g.fillStyle=VG;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.07)';for(var i=0;i<90;i++)g.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);
  g.fillStyle='rgba(0,0,0,.08)';for(i=0;i<60;i++)g.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);
  if(Math.random()<.08){g.fillStyle='rgba(255,255,255,.10)';g.fillRect(Math.random()*W,0,1,H);}
  g.fillStyle='rgba(255,240,200,'+(.02+.02*Math.random())+')';g.fillRect(0,0,W,H);
}
var last=0;
function loop(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
